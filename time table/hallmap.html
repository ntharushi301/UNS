<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Hall Location & Map - Student Portal</title>
  <link rel="stylesheet" href="../dashboard/base.css">
  <link rel="stylesheet" href="timetable.css">
</head>
<body>

  <!-- Navigation Panel Placeholder -->
  <div id="navbar-container"></div>

  <!-- Sidebar Drawer & Overlay Structure -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="sidebar-drawer" id="sidebar-drawer">
    <div id="sidebar-container"></div>
  </div>

  <main class="dashboard-container">
    <!-- Header Title & Back Button Row -->
    <div class="header-action-row">
      <section class="welcome-header">
        <h1>Campus Hall Location & Map</h1>
        <p class="subtitle">Technology Annex • Hall 01</p>
      </section>
      
      <!-- Back to Timetable Button -->
      <a href="daily-timetable.html" class="btn-change-password btn-back">
        <span>⬅</span> Back to Timetable
      </a>
    </div>

    <!-- Main Card Container -->
    <section class="card" style="padding: 28px; background-color: #0f192e;">
      
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
        
        <!-- Left Side: Interactive Campus Map Viewport -->
        <div style="background-color: #080f1e; border: 1px solid #1e293b; border-radius: 8px; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 16px; position: relative; min-height: 380px;">
          
          <!-- Library Building Block -->
          <div style="background-color: #1e293b; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #94a3b8; text-align: center; padding: 12px;">
            Main Library
          </div>

          <!-- Main Academic Building Block -->
          <div style="background-color: #1e293b; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #94a3b8; text-align: center; padding: 12px;">
            Main Academic Building
          </div>

          <!-- Highlighted Technology Annex Venue Block -->
          <div style="background-color: #0284c7; border: 2px solid #38bdf8; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #ffffff; text-align: center; padding: 12px; position: relative; box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);">
            <div style="width: 12px; height: 12px; background-color: #ef4444; border: 2px solid #ffffff; border-radius: 50%; margin-bottom: 8px; animation: pulse 2s infinite;"></div>
            <span>Technology Annex</span>
            <span style="font-size: 10px; opacity: 0.9; font-weight: 400; margin-top: 2px;">(Hall 01 Inside)</span>
          </div>

          <!-- Empty Quad Area / Pathways -->
          <div style="background-color: transparent;"></div>

        </div>

        <!-- Right Side: Venue Details Panel -->
        <div style="background-color: #080f1e; border: 1px solid #1e293b; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 20px;">
          
          <h2 style="font-size: 16px; font-weight: 600; color: #ffffff; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 12px;">
            <span>📍</span> Venue Details
          </h2>

          <div style="display: flex; flex-direction: column; gap: 16px;">
            
            <!-- Building Info -->
            <div>
              <label style="font-size: 10px; font-weight: 700; color: #64748b; letter-spacing: 0.8px; display: block; margin-bottom: 4px;">BUILDING</label>
              <span style="font-size: 13px; font-weight: 600; color: #ffffff;">Technology Annex Block B</span>
            </div>

            <!-- Floor & Room Info -->
            <div>
              <label style="font-size: 10px; font-weight: 700; color: #64748b; letter-spacing: 0.8px; display: block; margin-bottom: 4px;">FLOOR & ROOM</label>
              <span style="font-size: 13px; font-weight: 600; color: #ffffff;">Ground Floor, Hall 01</span>
            </div>

            <!-- Facilities Checklist -->
            <div>
              <label style="font-size: 10px; font-weight: 700; color: #64748b; letter-spacing: 0.8px; display: block; margin-bottom: 8px;">FACILITIES</label>
              <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #94a3b8;">
                <li style="display: flex; align-items: center; gap: 6px;"><span style="color: #22c55e;">✓</span> Air Conditioned</li>
                <li style="display: flex; align-items: center; gap: 6px;"><span style="color: #22c55e;">✓</span> Projector & Sound System</li>
                <li style="display: flex; align-items: center; gap: 6px;"><span style="color: #22c55e;">✓</span> Capacity: 120 Seats</li>
              </ul>
            </div>

          </div>

        </div>

      </div>

    </section>
  </main>

  <!-- Component Loading Script -->
  <script>
    // Fetch navbar from parent directory
    fetch('../dashboard/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
        
        const profileToggle = document.getElementById('profile-toggle');
        if (profileToggle) {
          profileToggle.addEventListener('click', toggleSidebar);
        }
      });

    // Fetch sidebar from parent directory & highlight Timetable link
    fetch('../dashboard/sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;

        const sidebarLinks = document.querySelectorAll('.sidebar-link');
        sidebarLinks.forEach(link => {
          link.classList.remove('active');
          if (link.innerText.includes('Timetable')) {
            link.classList.add('active');
          }
        });
      });

    const drawer = document.getElementById('sidebar-drawer');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleSidebar() {
      drawer.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    overlay.addEventListener('click', toggleSidebar);
  </script>
</body>
</html>
