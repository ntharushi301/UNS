<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture Materials - Student Portal</title>
  <link rel="stylesheet" href="../dashboard/base.css">
  <link rel="stylesheet" href="timetable.css">
</head>
<body>

  <!-- Navigation Panel Placeholder -->
  <div id="navbar-container"></div>

  <!-- Sidebar Drawer & Overlay Structure -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="sidebar-drawer" id="sidebar-drawer">
    <div id="sidebar-container"></div>
  </div>

  <main class="dashboard-container">
    <!-- Header Back Navigation -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 24px;">
      <a href="daily-timetable.html" class="btn-change-password btn-back">
        <span>⬅</span> Back to Timetable
      </a>
    </div>

    <!-- Main Grid: Slide Viewer & Available Files -->
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
      
      <!-- Left Column: Presentation Slide Viewer -->
      <section class="card" style="padding: 24px; background-color: #0f192e; display: flex; flex-direction: column; align-items: center;">
        
        <!-- Slide Screen Container -->
        <div style="width: 100%; aspect-ratio: 16 / 9; background-color: #080f1e; border: 1px solid #1e293b; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);">
          <h2 style="font-size: 24px; font-weight: 700; color: #2dd4bf; margin-bottom: 12px;">CS401 - Lecture 05</h2>
          <p style="font-size: 14px; color: #94a3b8;">TCP/IP Protocol Suite & Routing Algorithms</p>
        </div>

        <!-- Slide Navigation Controls -->
        <div style="margin-top: 20px; background-color: #080f1e; border: 1px solid #1e293b; border-radius: 8px; padding: 6px 16px; display: flex; align-items: center; gap: 16px;">
          <button type="button" style="background: transparent; border: none; color: #38bdf8; cursor: pointer; font-size: 14px;">◀</button>
          <span style="font-size: 12px; color: #94a3b8; font-weight: 600;">Slide 01 / 24</span>
          <button type="button" style="background: transparent; border: none; color: #38bdf8; cursor: pointer; font-size: 14px;">▶</button>
        </div>

      </section>

      <!-- Right Column: Available Files & Download Actions -->
      <section style="display: flex; flex-direction: column; gap: 16px;">
        
        <h2 style="font-size: 16px; font-weight: 600; color: #ffffff; display: flex; align-items: center; gap: 8px;">
          <span>📂</span> Available Files
        </h2>

        <div style="display: flex; flex-direction: column; gap: 12px;">
          
          <!-- Selected Active File Card -->
          <div style="background-color: #0d3838; border: 1.5px solid #2dd4bf; border-radius: 8px; padding: 16px; cursor: pointer; transition: border-color 0.2s;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
              <span style="font-size: 16px;">📄</span>
              <span style="font-size: 13px; font-weight: 600; color: #2dd4bf;">Lecture_05_TCPIP.pdf</span>
            </div>
            <span style="font-size: 11px; color: #64748b; display: block; padding-left: 26px;">4.2 MB • Updated Today</span>
          </div>

          <!-- Secondary File Card -->
          <div style="background-color: #080f1e; border: 1px solid #1e293b; border-radius: 8px; padding: 16px; cursor: pointer; transition: border-color 0.2s;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
              <span style="font-size: 16px;">📄</span>
              <span style="font-size: 13px; font-weight: 600; color: #cbd5e1;">Routing_Lab_Guide.pdf</span>
            </div>
            <span style="font-size: 11px; color: #64748b; display: block; padding-left: 26px;">1.8 MB • Uploaded Oct 12</span>
          </div>

        </div>

        <!-- Download All Package Button -->
        <button type="button" class="btn-teal" style="background-color: #0284c7; width: 100%; padding: 12px; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px;">
          <span>🎁</span> Download All Material (.ZIP)
        </button>

      </section>

    </div>
  </main>

  <!-- Component Loading Script -->
  <script>
    // Fetch navbar from parent directory
    fetch('../dashboard/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
        
        const profileToggle = document.getElementById('profile-toggle');
        if (profileToggle) {
          profileToggle.addEventListener('click', toggleSidebar);
        }
      });

    // Fetch sidebar from parent directory & highlight Timetable link
    fetch('../dashboard/sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;

        const sidebarLinks = document.querySelectorAll('.sidebar-link');
        sidebarLinks.forEach(link => {
          link.classList.remove('active');
          if (link.innerText.includes('Timetable')) {
            link.classList.add('active');
          }
        });
      });

    const drawer = document.getElementById('sidebar-drawer');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleSidebar() {
      drawer.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    overlay.addEventListener('click', toggleSidebar);
  </script>
</body>
</html>
