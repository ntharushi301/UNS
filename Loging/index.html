<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Access the intelligence portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <!-- SVG Logo -->
    <img src ="../Sources/Logo.png" width = "100px" height = "100px">
    <h1>Welcome Back</h1>
    <p class="subtitle">Access the intelligence portal</p>

    <form class="login-form" onsubmit="event.preventDefault();">
      <!-- Email Input -->
      <div class="form-group">
        <div class="label-row">
          <label for="email">Email Address</label>
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke-linecap="round"/>
            <polyline points="3 7 12 13 21 7" stroke-linecap="round"/>
          </svg>
          <input type="email" id="email" placeholder="name@stu.cmb.ac.lk">
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot-pass">Forgot password?</a>
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2">
            <rect x="5" y="11" width="14" height="10" rx="2" stroke-linecap="round"/>
            <path d="M8 11 V7 A4 4 0 0 1 16 7 V11" stroke-linecap="round"/>
          </svg>
          <input type="password" id="password" value="••••••••" >
          <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
      </div>

      <!-- Sign In Button -->
      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>OR CONTINUE WITH</span>
    </div>

    <!-- Google Button -->
    <button class="btn-google">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#ffffff" d="M12.24 10.285V13.4h6.887c-.58 2.31-2.8 4-5.5 4-3.315 0-6-2.685-6-6s2.685-6 6-6c1.48 0 2.83.54 3.88 1.43l2.38-2.38C18.42 3.12 15.5 2 12.24 2 6.7 2 2.2 6.5 2.2 12s4.5 10 10.04 10c5.78 0 9.62-4.06 9.62-9.79 0-.66-.07-1.3-.18-1.925H12.24z"/>
      </svg>
      Google
    </button>

    <!-- Sign up footer -->
    <div class="footer-text">
      Don't have an account? <a href="#">Sign up now</a>
    </div>
  </div>

</body>
</html>
