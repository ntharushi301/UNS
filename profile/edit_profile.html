<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile Settings - Student Portal</title>
  <link rel="stylesheet" href="../dashboard/base.css">
  <link rel="stylesheet" href="profiles.css">
</head>
<body>

  <!-- Navigation Panel Placeholder -->
  <div id="navbar-container"></div>

  <!-- Sidebar Drawer & Overlay Structure -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="sidebar-drawer" id="sidebar-drawer">
    <div id="sidebar-container"></div>
  </div>

  <main class="dashboard-container profile-page">
    
    <!-- Page Header -->
    <header class="welcome-header">
      <h1>Edit Profile Settings</h1>
    </header>

    <!-- Top Section: Avatar Upload & Edit Credentials Grid -->
    <div class="profile-top-grid">
      
      <!-- Left Card: Avatar Upload Section -->
      <section class="card profile-user-card">
        <div class="large-avatar-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        
        <div class="avatar-actions" style="width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center;">
          <button type="button" class="btn-edit-settings" style="width: 80%; padding: 10px 0;">Upload New Photo</button>
          <button type="button" class="btn-change-password" style="width: 80%; border-color: #ef4444; color: #ef4444; margin: 0;">Remove Photo</button>
        </div>
        <span class="user-intake" style="margin-top: 14px;">PNG, JPG up to 2MB</span>
      </section>

      <!-- Right Card: Edit Credentials Form -->
      <section class="card academic-credentials-card">
        <h2 class="card-title">Edit Credentials</h2>
        
        <form id="edit-credentials-form" class="credentials-grid">
          <div class="credential-field">
            <label for="display-name">DISPLAY NAME</label>
            <input type="text" id="display-name" class="field-value" value="NADUN SENANAYAKE" style="width: 100%; outline: none; border: 1px solid #00b4d8; color: #ffffff;" />
          </div>

          <div class="credential-field">
            <label for="index-number">INDEX NUMBER (READ-ONLY)</label>
            <input type="text" id="index-number" class="field-value" value="2023IT0000" readonly style="width: 100%; opacity: 0.6; cursor: not-allowed;" />
          </div>

          <div class="credential-field">
            <label for="sandbox-batch">ASSIGNED SANDBOX BATCH</label>
            <select id="sandbox-batch" class="field-value" style="width: 100%; color: #ffffff; background-color: #080f1e; cursor: pointer;">
              <option value="year2-sandbox-b" selected>Year 2 - Sandbox B</option>
              <option value="year2-sandbox-a">Year 2 - Sandbox A</option>
              <option value="year1-sandbox-a">Year 1 - Sandbox A</option>
            </select>
          </div>

          <div class="credential-field">
            <label for="university-email">UNIVERSITY EMAIL (READ-ONLY)</label>
            <input type="email" id="university-email" class="field-value" value="2023IT0000@sdu.cmb.ac.lk" readonly style="width: 100%; opacity: 0.6; cursor: not-allowed;" />
          </div>
        </form>
      </section>
    </div>

    <!-- Bottom Section: Save System Settings Action Card -->
    <section class="card" style="padding: 28px;">
      <h2 class="card-title" style="margin-bottom: 8px;">Save System Settings</h2>
      <p class="subtitle" style="margin-bottom: 24px;">Ensure all your display details are up to date before saving changes.</p>

      <div style="display: flex; gap: 16px;">
        <button type="submit" form="edit-credentials-form" class="btn-edit-settings" style="background-color: #10b981; padding: 12px 28px;">Save Changes</button>
        <button type="button" class="btn-change-password" style="padding: 12px 28px; margin: 0;">Cancel</button>
      </div>
    </section>

  </main>

  <!-- Component Loading & Toggle Logic -->
  <script>
    // Load navbar.html
    fetch('../dashboard/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
        
        const profileToggle = document.getElementById('profile-toggle');
        if (profileToggle) {
          profileToggle.addEventListener('click', toggleSidebar);
        }
      });

    // Load sidebar.html
    fetch('../dashboard/sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
      });

    const drawer = document.getElementById('sidebar-drawer');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleSidebar() {
      drawer.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    overlay.addEventListener('click', toggleSidebar);
  </script>
</body>
</html>
